---
- name: Restart dropbear-rescue
  ansible.builtin.systemd:
    name: dropbear-rescue.service
    state: restarted
    daemon_reload: true

- name: Reexec systemd
  ansible.builtin.systemd:
    daemon_reexec: true

- name: Restart journald
  ansible.builtin.systemd:
    name: systemd-journald.service
    state: restarted

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
