---
- name: Provision Raspberry Pi home server
  hosts: all
  become: true
  gather_facts: true

  vars_files:
    - "{{ playbook_dir }}/vault.yml"

  roles:
    - role: base
    - role: docker
    # Rescue access (dropbear, watchdog, self-check, journal, backup) goes in
    # before the stack so a failed stack deploy never leaves you locked out.
    - role: rescue
    - role: home_server
