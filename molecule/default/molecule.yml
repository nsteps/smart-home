---
# Tests the OS-level provisioning (base + docker + rescue roles) for convergence
# and idempotence inside a systemd-enabled Debian 12 container.
# The full service stack (home_server) is validated on the real Pi, not here —
# it needs a Zigbee dongle and pulls multi-GB images.
role_name_check: 1

driver:
  name: docker

platforms:
  - name: smarthome-debian12
    image: geerlingguy/docker-debian12-ansible:latest
    command: /usr/sbin/init
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../roles
  config_options:
    defaults:
      interpreter_python: auto_silent
  inventory:
    group_vars:
      all:
        # molecule does not load the project's group_vars/all.yml, so the
        # variables the base/docker roles need are provided here explicitly.
        pi_hostname: molecule-test
        server_timezone: Etc/UTC
        server_user: root
        # Keep the test fast and self-contained.
        base_do_full_upgrade: false
        base_install_unattended_upgrades: false
        base_enable_ufw: false
        # rescue role: everything else comes from roles/rescue/defaults.
        # No sshd in the container, so the self-check would restart a missing
        # unit — keep the timer installed but disable the sshd escalation.
        rescue_check_ssh_restart_after: 0
        rescue_check_reboot_after: 0
        rescue_healthcheck_url: ""

verifier:
  name: ansible
